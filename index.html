<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daybook">
<meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E131A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>Daybook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a pocket diary. Sticky header with quick-add, a month calendar as the main view, Manage as a secondary page. Wide screens split calendar and day detail side by side. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#17202B; --muted:#5F6B7C; --rule:#DCE1E8; --soft:#E7EDF7;
  --accent:#1F5FD1; --accent-ink:#FFFFFF; --warn:#B8430E;
  --c-uni:#2C6BDB; --c-study:#7449D0; --c-life:#15875C; --c-other:#B07A0C; --c-work:#B8327E;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131A; --surface:#161D26; --ink:#E5E9EF; --muted:#8F9AAB; --rule:#28323F; --soft:#1B2638;
  --accent:#6E9CFF; --accent-ink:#0B1220; --warn:#F0895A;
  --c-uni:#6E9CFF; --c-study:#AA8BF1; --c-life:#4BC794; --c-other:#E2B04A; --c-work:#F07BB8; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#161D26; --ink:#E5E9EF; --muted:#8F9AAB; --rule:#28323F; --soft:#1B2638;
  --accent:#6E9CFF; --accent-ink:#0B1220; --warn:#F0895A;
  --c-uni:#6E9CFF; --c-study:#AA8BF1; --c-life:#4BC794; --c-other:#E2B04A; --c-work:#F07BB8; color-scheme:dark }
html{color-scheme:light}
html,body{min-height:100%}
body{margin:0;padding-bottom:env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}

header.top{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;flex-direction:column;gap:10px;padding-block:14px 10px}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.titlerow h1{font-family:var(--f-display);font-weight:700;font-size:1.55rem;letter-spacing:-.01em;margin:0;text-wrap:balance}
.titlerow .meta{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}

.addbar{display:flex;gap:8px}
.addbar input{flex:1;min-width:0;border:1px solid var(--rule);background:var(--surface);border-radius:var(--r);padding:11px 12px}
.addbar input::placeholder{color:var(--muted)}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:var(--r);padding:10px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--warn)}
.btn.small{padding:6px 10px;font-size:.85rem}
.preview{font-size:.8rem;color:var(--muted);min-height:1.2em;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.preview b{color:var(--ink);font-weight:600}

.hdright{display:flex;align-items:center;gap:10px}
.sync{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c-life)}
.sync[data-s=saving]::before{background:var(--c-other)}
.sync[data-s=offline]::before,.sync[data-s=auth]::before{background:var(--warn)}
.setup{padding:16px;display:flex;flex-direction:column;gap:12px;max-width:560px}
.setup h2{font-family:var(--f-display);margin:0;font-size:1.2rem}
.setup ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:.9rem}
.setup ol b{color:var(--ink)}

main .wrap{padding-block:18px 60px}
.grid2{display:grid;gap:22px}
@media (min-width:760px){.grid2{grid-template-columns:5fr 6fr;align-items:start}}
.grid2>*{min-width:0}
/* Phone (portrait): one column in reading order — calendar, day, to do, someday, this week, this month. */
@media (max-width:759px){.daygrid{gap:18px}.daygrid>.block{display:contents}.daygrid>.block>*{order:var(--o,9);min-width:0}}

h2.sec{font-family:var(--f-display);font-size:1.05rem;font-weight:600;margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
h2.sec .count{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);font-weight:400}
.block{display:flex;flex-direction:column;gap:18px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.empty{padding:14px;color:var(--muted);font-size:.9rem}

/* schedule */
.ev{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:10px 12px;border-top:1px solid var(--rule);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.ev:first-child{border-top:0}
.ev .t{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.35}
.ev .body{border-left:3px solid var(--cat);padding-left:10px;min-width:0}
.ev .name{font-weight:600;overflow-wrap:anywhere}
.ev .sub{font-size:.8rem;color:var(--muted)}
.ev.past{opacity:.55}
.nowline{display:flex;align-items:center;gap:8px;padding:0 12px;font-family:var(--f-mono);font-size:.7rem;color:var(--warn)}
.nowline::after{content:"";flex:1;height:1px;background:var(--warn)}

/* tasks */
.task{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-top:1px solid var(--rule);background:var(--surface);position:relative}
.task.moving{z-index:2;box-shadow:0 6px 18px rgba(10,14,20,.12)}
.check{transition:background-color .15s ease}
.task:first-child{border-top:0}
.check{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--cat);background:none;display:grid;place-items:center;margin-top:1px;padding:0}
.check svg{width:14px;height:14px;opacity:0}
.task.done .check{background:var(--cat)}
.task.done .check svg{opacity:1}
.check svg path{stroke:var(--surface)}
.task .txt{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.task .name{overflow-wrap:anywhere}
.task.done .name{text-decoration:line-through;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.chip{font-size:.72rem;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--muted);font-family:var(--f-mono)}
.chip.late{color:var(--warn)}
.chip.cat{color:var(--cat);background:none;border:1px solid var(--cat)}

/* week */
.dayrow{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:10px 12px;border-top:1px solid var(--rule)}
.dayrow:first-child{border-top:0}
.dayrow .dl{font-family:var(--f-display);font-weight:600;line-height:1.1}
.dayrow .dl small{display:block;font-family:var(--f-mono);font-weight:400;font-size:.72rem;color:var(--muted)}
.dayrow.today .dl{color:var(--accent)}
.dayrow .items{display:flex;flex-direction:column;gap:4px;min-width:0}
.mini{display:flex;gap:8px;align-items:baseline;font-size:.9rem;background:none;border:0;padding:0;text-align:left;cursor:pointer;min-width:0}
.mini .tm{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);flex:none;width:44px}
.mini .dot{width:8px;height:8px;border-radius:50%;background:var(--cat);flex:none;transform:translateY(-1px)}
.mini .box{width:12px;height:12px;border-radius:3px;border:1.5px solid var(--cat);flex:none;transform:translateY(1px)}
.mini.done .box{background:var(--cat)}
.mini.done span:last-child{text-decoration:line-through;color:var(--muted)}
.mini span:last-child{overflow-wrap:anywhere;min-width:0}
.pager{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.pager .lbl{font-family:var(--f-display);font-weight:600;font-size:1.05rem;flex:1;min-width:0}

/* month */
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--rule)}
.mgrid .hd{background:var(--surface);font-family:var(--f-mono);font-size:.7rem;color:var(--muted);text-align:center;padding:6px 0}
.cell{background:var(--surface);min-height:62px;padding:5px;border:0;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.cell.out{background:var(--bg);color:var(--muted)}
.cell .n{font-family:var(--f-mono);font-size:.8rem;font-variant-numeric:tabular-nums}
.cell.today .n{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 6px;align-self:flex-start}
.cell.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.cell .dots{display:flex;flex-wrap:wrap;gap:3px}
.cell .dots i{width:6px;height:6px;border-radius:50%;background:var(--cat)}
.cell .dots i.sq{border-radius:1px;background:none;border:1.5px solid var(--cat)}

/* manage */
.row{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--rule);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-child{border-top:0}
.row .bar{width:3px;align-self:stretch;background:var(--cat);border-radius:2px;flex:none}
.row .name{font-weight:600;overflow-wrap:anywhere}
.row .sub{font-size:.8rem;color:var(--muted)}
.row>div{min-width:0;flex:1}
.hint{font-size:.85rem;color:var(--muted);max-width:65ch}
.hint code{font-family:var(--f-mono);font-size:.8rem;background:var(--soft);padding:0 4px;border-radius:4px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.scrim{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.sheet{border-radius:16px}}
.sheet h3{font-family:var(--f-display);margin:0;font-size:1.2rem}
.field{display:flex;flex-direction:column;gap:5px}
.field>label,.lab{font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{border:1px solid var(--rule);background:var(--bg);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}
.seg{display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--bg);padding:8px 4px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.wds{display:flex;gap:4px}
.wds button{flex:1;border:1px solid var(--rule);background:var(--bg);border-radius:6px;padding:6px 0;font-family:var(--f-mono);font-size:.75rem}
.wds button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .spacer{flex:1}
.err{color:var(--warn);font-size:.85rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:.88rem;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}

/* desk view (?desk): an 800x480 page for the e-ink display. Pure black on white, no greys, so it survives 1-bit conversion. */
.desk-mode{background:#fff;color:#000;padding:0}
.desk-mode header.top{display:none}
.desk-mode main .wrap{padding:0;max-width:none;margin:0}
.desk{width:800px;height:480px;overflow:hidden;background:#fff;color:#000;display:grid;grid-template-rows:auto 1fr auto;font-family:var(--f-body)}
.dk-hd{display:flex;justify-content:space-between;align-items:baseline;padding:11px 20px 9px;background:#000;color:#fff}
.dk-hd h1{font-family:var(--f-display);font-size:34px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.01em}
.dk-hd span{font-family:var(--f-mono);font-size:18px;font-weight:500}
.dk-body{display:grid;grid-template-columns:1fr 300px;min-height:0}
.dk-col{padding:14px 20px 10px;display:flex;flex-direction:column;gap:14px;min-height:0;overflow:hidden}
.dk-col+.dk-col{border-left:2px solid #000;padding-left:16px;padding-right:16px}
.dk-lab{font-family:var(--f-mono);font-size:14px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:3px;margin-bottom:6px}
.dk-row{display:grid;grid-template-columns:50px 1fr;gap:8px;align-items:baseline;padding:3px 0}
.dk-row .tm{font-family:var(--f-mono);font-size:15px;font-weight:500}
.dk-row .ti{font-size:17px;font-weight:600;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.dk-row .ti small{font-weight:500;font-size:14px}
.dk-task{display:flex;align-items:center;gap:12px;padding:7px 0}
.dk-task i{flex:none;width:21px;height:21px;border:3px solid #000;border-radius:4px}
.dk-task .ti{flex:1;min-width:0;font-size:25px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dk-task .mt{flex:none;font-family:var(--f-mono);font-size:15px;font-weight:500}

.dk-task.sm{gap:9px;padding:3px 0}
.dk-task.sm i{width:15px;height:15px;border-width:2.5px;border-radius:3px}
.dk-task.sm .ti{font-size:17px}
.dk-task.sm .mt{font-size:12px}
.dk-more,.dk-empty{font-size:16px;font-weight:500;padding:3px 0}
.dk-ft{font-family:var(--f-mono);font-size:13px;padding:3px 20px;border-top:2px solid #000}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="titlerow">
      <h1 id="hdDate">Today</h1>
      <div class="hdright"><span class="sync" id="sync" data-s="ok" hidden></span><span class="meta" id="hdMeta"></span><button class="btn small" type="button" id="manageBtn">Manage</button></div>
    </div>
    <form class="addbar" id="addForm" autocomplete="off">
      <input id="quick" aria-label="Add a task or event" placeholder="Add… e.g. meal prep weekly, clean car monthly, tute tue 2-4pm every week #uni">
      <button class="btn" type="button" id="moreBtn" title="Add with details">Details</button>
      <button class="btn primary" type="submit">Add</button>
    </form>
    <div class="preview" id="preview" aria-live="polite"></div>
  </div>
</header>
<main><div class="wrap" id="view"><div class="panel"><div class="empty">Loading your daybook…</div></div></div></main>
<div id="sheetRoot"></div>

<script>
(() => {
/* ---------- dates ---------- */
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const P = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addD = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const dIdx = d => (d.getDay()+6) % 7;               // Mon = 0
const sow = d => addD(d, -dIdx(d));
const som = d => new Date(d.getFullYear(), d.getMonth(), 1);
const addM = (d,n) => new Date(d.getFullYear(), d.getMonth()+n, 1);
const dim = (y,m) => new Date(y, m+1, 0).getDate();
const diffD = (a,b) => Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate()) - Date.UTC(a.getFullYear(),a.getMonth(),a.getDate())) / 864e5);
const diffM = (a,b) => (b.getFullYear()-a.getFullYear())*12 + b.getMonth() - a.getMonth();
// "?at=2026-10-05T10:30" pins the clock, for previewing the desk view at another time.
const QS = new URLSearchParams(location.search);
const AT = QS.get("at") && !isNaN(new Date(QS.get("at"))) ? new Date(QS.get("at")) : null;
const clock = () => AT ? new Date(AT) : new Date();
const DESK = QS.has("desk");
const today = () => { const n = clock(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const WD = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const LONGWD = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const LONGMON = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const fmtShort = d => `${WD[dIdx(d)]} ${d.getDate()} ${MON[d.getMonth()]}`;
const isoWeek = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - n); const y = new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t - y) / 864e5 + 1) / 7); };
const fmtTime = s => { if (!s) return ""; let [h,m] = s.split(":").map(Number); const ap = h >= 12 ? "pm" : "am"; h = h % 12 || 12; return m ? `${h}:${pad(m)}${ap}` : `${h}${ap}`; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CATS = { uni:"Uni", study:"Study", work:"Work", life:"Life", other:"Other" };
const catVar = c => `--cat:var(--c-${CATS[c] ? c : "other"})`;

/* ---------- recurrence ---------- */
// Returns occurrence dates (YYYY-MM-DD) of an item between from..to (Date, inclusive).
function occ(it, from, to) {
  if (!it.date) return [];
  const a = P(it.date);
  const until = it.until ? P(it.until) : null;
  const end = until && until < to ? until : to;
  const skip = new Set(it.skip || []);
  const out = [];
  const push = d => { if (d >= from && d <= end && d >= a) { const k = ymd(d); if (!skip.has(k)) out.push(k); } };
  const r = it.repeat;
  if (!r || !r.unit) { push(a); return out; }
  const ev = Math.max(1, r.every || 1);
  if (r.unit === "day") {
    let k = Math.max(0, Math.ceil(diffD(a, from) / ev));
    for (let d = addD(a, k*ev); d <= end; k++, d = addD(a, k*ev)) push(d);
  } else if (r.unit === "week") {
    const days = (r.days && r.days.length) ? [...r.days].sort((x,y)=>x-y) : [dIdx(a)];
    const aw = sow(a);
    for (let w = sow(from); w <= end; w = addD(w, 7)) {
      const wi = diffD(aw, w) / 7;
      if (wi < 0 || wi % ev) continue;
      for (const di of days) push(addD(w, di));
    }
  } else if (r.unit === "month") {
    const dom = a.getDate();
    for (let m = som(from); m <= end; m = addM(m, 1)) {
      const mi = diffM(a, m);
      if (mi < 0 || mi % ev) continue;
      push(new Date(m.getFullYear(), m.getMonth(), Math.min(dom, dim(m.getFullYear(), m.getMonth()))));
    }
  }
  return out;
}
const latestOcc = (it, ref) => { const l = occ(it, addD(ref, -800), ref); return l.length ? l[l.length-1] : null; };
const periodStart = (scope, d) => scope === "week" ? sow(d) : scope === "month" ? som(d) : d;

function repeatText(it) {
  const r = it.repeat; if (!r || !r.unit) return "";
  const n = r.every || 1;
  if (r.unit === "day") return n === 1 ? "daily" : `every ${n} days`;
  if (r.unit === "month") return n === 1 ? "monthly" : `every ${n} months`;
  const days = r.days && r.days.length && !(it.kind === "task" && it.scope === "week") ? r.days.map(i => WD[i]).join(", ") : "";
  const base = n === 1 ? "weekly" : n === 2 ? "fortnightly" : `every ${n} weeks`;
  return days ? `${days} · ${base}` : base;
}


/* ---------- GitHub sync ----------

  const dayRows = (D, isToday) => {

    for (const t of tasks()) if (t.after && t.repeat && t.repeat.unit && occ(t, D, D).length && !(t.doneDates || []).includes(Dk) && (!isToday || nowS < t.after))

      </div>

  </div>`;
}

// Lists are rendered in full, then trimmed from the end until each column fits, with a "+N more" line.
function fitDesk() {
  const vis = sec => [...sec.querySelectorAll(".dk-it:not([hidden])")];
  document.querySelectorAll("#view .dk-col").forEach(col => {
    const secs = [...col.querySelectorAll(".dk-fit")];
    for (let g = 0; g < 80 && col.scrollHeight > col.clientHeight + 1; g++) {
      // Trim the longest list first. The to-do list keeps at least 3 rows while another list can still give way.
      const cand = secs.map(sec => ({ sec, v: vis(sec), keep: +(sec.dataset.keep || 1) })).sort((x, y) => (y.v.length - y.keep) - (x.v.length - x.keep));
      const pick = cand.find(x => x.v.length > x.keep) || cand.find(x => x.v.length > 1);
      if (!pick) break;
      pick.v[pick.v.length - 1].hidden = true;
      let more = pick.sec.querySelector(".dk-more");
      if (!more) { more = document.createElement("div"); more.className = "dk-more"; pick.sec.appendChild(more); }
      more.textContent = `+${pick.sec.querySelectorAll(".dk-it[hidden]").length} more`;
    }
  });
}

  const flip = flipNext && view !== "manage"; flipNext = false;

    if (st.kind === "event") {
      if (!out.start) { err.textContent = "Events need a start time."; return; }
      if (!out.end || out.end < out.start) { const [h, m] = out.start.split(":").map(Number); out.end = `${pad(Math.min(h+1,23))}:${pad(m)}`; }
      delete out.scope; delete out.done; delete out.doneOn; delete out.doneDates;
    } else {
      out.scope = st.scope;
      if (st.scope === "someday") out.date = null;
      else { const d = P(out.date || ymd(today())); out.date = ymd(periodStart(st.scope, d)); }
      delete out.start; delete out.end; delete out.location;
      if (out.done === undefined) out.done = false;
    }
    if (st.unit && out.date) {
      out.repeat = { unit: st.unit, every: out.repeat?.every || 1 };
      if (st.unit === "week" && (st.kind === "event" || st.scope === "day")) out.repeat.days = (st.days.length ? st.days : [dIdx(P(out.date))]).sort((a,b)=>a-b);
      out.doneDates = out.doneDates || [];
    } else { out.repeat = null; out.until = null; }
    for (const k of Object.keys(out)) if (out[k] === undefined) delete out[k];
    try {
      if (existing) await db.doc("items/" + existing.id).set(out);
      else await db.collection("items").add({ ...out, created: new Date().toISOString() });
      close(); toast(existing ? "Saved" : "Added");
    } catch (ex) { err.textContent = "Couldn't save. Check your connection and try again."; }
  };
}

/* ---------- wiring ---------- */
const quick = $("#quick");
quick.addEventListener("input", () => { const v = quick.value.trim(); $("#preview").innerHTML = v ? describe(parseQuick(v)) : ""; });
$("#addForm").addEventListener("submit", async e => {
  e.preventDefault();
  const v = quick.value.trim(); if (!v) return;
  const r = parseQuick(v);
  if (!r.title) { toast("Add a few words describing it."); return; }
  try { await db.collection("items").add(toDoc(r)); quick.value = ""; $("#preview").innerHTML = ""; toast("Added: " + r.title); }
  catch (ex) { toast("Couldn't save. Check your connection and try again."); }
});
$("#moreBtn").addEventListener("click", () => {
  const v = quick.value.trim();
  openSheet(null, null, v ? parseQuick(v) : null); quick.value = ""; $("#preview").innerHTML = "";
});
$("#view").addEventListener("submit", async e => {
  if (e.target.id !== "setupForm") return;
  e.preventDefault();
  const token = $("#sToken").value.trim(), repo = $("#sRepo").value.trim().replace(/^https?:\/\/github\.com\//, "").replace(/\/$/, "");
  const err = $("#sErr");
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { err.textContent = "Enter the repository as owner/name, e.g. Ollyj77/daybook-data."; return; }
  err.textContent = "Checking…";
  const prev = store.cfg; store.cfg = { token, repo };
  try {
    const p = await pull();
    lsSet(CFG_KEY, store.cfg);
    if (!prev || prev.repo !== repo) { store.queue = []; }
    store.remote = p.items; store.sha = p.sha; persist();
    settingsOpen = false; loaded = true; setStatus("ok"); emit(); flush(); toast("Connected");
  } catch (x) {
    store.cfg = prev;
    err.textContent = x.code === "auth" ? "GitHub refused that key, or it can't see this repository. Check it has Contents: Read and write on daybook-data." : "Couldn't reach GitHub. Check your connection and try again.";
  }
});
$("#manageBtn").addEventListener("click", () => { settingsOpen = false; view = view === "manage" ? "month" : "manage"; render(); window.scrollTo(0, 0); });
$("#view").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "sCancel") { settingsOpen = false; return render(); }
  if (b.dataset.sync) {
    const a = b.dataset.sync;
    if (a === "now") { flush(); refresh().then(render); toast("Syncing…"); }
    else if (a === "key") { settingsOpen = true; render(); }
    else if (a === "forget") {
      if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = store.queue.length ? "Unsynced changes will be lost. Tap again" : "Tap again to disconnect"; return; }
      try { [CFG_KEY, CACHE_KEY, QUEUE_KEY].forEach(k => localStorage.removeItem(k)); } catch (x) {}
      store.cfg = null; store.remote = {}; store.sha = null; store.queue = []; items = []; loaded = false; render();
    }
    return;
  }
  if (b.dataset.tick) return toggle(b.dataset.tick, b.dataset.key);
  if (b.dataset.edit) { const it = items.find(i => i.id === b.dataset.edit); if (it) openSheet(it, b.dataset.key); return; }
  if (b.dataset.day) { selDay = b.dataset.day; monthOff = diffM(som(today()), som(P(selDay))); return render(); }
  if (b.dataset.nav) {
    const n = b.dataset.nav;
    if (n === "w-1") weekOff--; else if (n === "w1") weekOff++; else if (n === "w0") weekOff = 0;
    else if (n === "today") { monthOff = 0; selDay = ymd(today()); }
    else if (n === "m-1") monthOff--; else if (n === "m1") monthOff++; else if (n === "m0") monthOff = 0;
    render();
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#sheetRoot").innerHTML) $("#sheetRoot").innerHTML = ""; });

// Re-render at midnight and every few minutes so "now" and rollover stay current.
let lastDay = ymd(today());
setInterval(() => { if (ymd(today()) !== lastDay) { lastDay = ymd(today()); recent.clear(); } if (!$("#sheetRoot").innerHTML) render(); }, 120000);

render();
db = ghdb;
db.collection("items").onSnapshot(snap => {
  items = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(i => i && i.title);
  if (store.cfg && (Object.keys(store.remote).length || store.sha)) loaded = true;
  render();
});
setStatus(store.status);
if (store.cfg) refresh().then(() => { loaded = true; render(); document.body.dataset.ready = "1"; });
setInterval(() => { if (document.visibilityState === "visible") refresh(); }, 60000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });
window.addEventListener("online", () => { flush(); refresh(); });
})();
</script>
</body>
