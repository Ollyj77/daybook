<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daybook desk</title>
<style>
  body{margin:0;background:#2b2b2b;color:#ddd;font:15px/1.4 system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px}
  .frame{background:#d8d6cf;padding:14px;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:100%}
  .frame img{display:block;width:800px;max-width:100%;height:auto;image-rendering:pixelated}
  p{margin:0;font-size:13px;color:#aaa;text-align:center}
  a{color:#ccc}
</style>
</head>
<body>
  <div class="frame"><img id="f" src="frame.png" alt="What the e-ink display shows"></div>
  <p>Last changed <span id="u">–</span>. Checks every 5 minutes; this page reloads itself.</p>
  <p><a href="last-attempt.png">Last attempt</a> (useful if the frame isn't updating)</p>
<script>
  const load = () => {
    document.getElementById("f").src = "frame.png?" + Date.now();
    fetch("updated.txt?" + Date.now()).then(r => r.ok ? r.text() : "–").then(t => document.getElementById("u").textContent = t.trim()).catch(() => {});
  };
  load(); setInterval(load, 60000);
</script>
</body>
</html>
